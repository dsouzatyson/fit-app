<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Image Editor — Test UI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      padding: 28px;
      width: 100%;
      max-width: 560px;
    }

    h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #6e6e73; margin-bottom: 24px; }

    /* Backend URL */
    .url-row { display: flex; gap: 8px; margin-bottom: 20px; }
    .url-row input {
      flex: 1;
      padding: 9px 12px;
      border: 1.5px solid #d2d2d7;
      border-radius: 8px;
      font-size: 13px;
    }

    /* Image pickers */
    .pickers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }

    .picker {
      aspect-ratio: 1;
      border: 2px dashed #d2d2d7;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      background: #fafafa;
      transition: border-color .2s;
    }
    .picker:hover { border-color: #0071e3; }
    .picker.has-image { border-style: solid; border-color: #0071e3; }
    .picker img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .picker input[type=file] {
      position: absolute; inset: 0;
      opacity: 0; cursor: pointer; width: 100%; height: 100%;
      z-index: 3;
    }
    .picker-label {
      font-size: 12px; color: #6e6e73; text-align: center;
      padding: 0 8px; pointer-events: none; z-index: 1;
    }
    .picker-icon { font-size: 28px; margin-bottom: 6px; pointer-events: none; z-index: 1; }
    .picker-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .2s; z-index: 2;
      pointer-events: none;
    }
    .picker:hover .picker-overlay { opacity: 1; }
    .picker-overlay span { color: #fff; font-size: 12px; font-weight: 600; }

    /* Garment picker with tabs */
    .garment-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mode-tabs {
      display: flex;
      border-radius: 8px;
      overflow: hidden;
      border: 1.5px solid #d2d2d7;
      background: #f5f5f7;
    }
    .mode-tab {
      flex: 1;
      padding: 5px 0;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #6e6e73;
      transition: background .15s, color .15s;
    }
    .mode-tab.active {
      background: #0071e3;
      color: #fff;
    }

    /* URL mode */
    .garment-url-panel { display: flex; flex-direction: column; gap: 8px; }
    .garment-url-panel input[type=url] {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #d2d2d7;
      border-radius: 8px;
      font-size: 13px;
    }
    .garment-url-panel input[type=url]:focus { outline: none; border-color: #0071e3; }

    .url-preview {
      aspect-ratio: 1;
      border-radius: 12px;
      border: 2px solid #0071e3;
      overflow: hidden;
      display: none;
    }
    .url-preview.show { display: block; }
    .url-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Form fields */
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #d2d2d7;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 16px;
      resize: vertical;
    }
    textarea:focus, select:focus, .url-row input:focus {
      outline: none; border-color: #0071e3;
    }

    /* Button */
    button.primary {
      width: 100%; padding: 13px;
      background: #0071e3; color: #fff;
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .2s;
    }
    button.primary:hover:not(:disabled) { background: #0077ed; }
    button.primary:disabled { background: #a0c4f1; cursor: not-allowed; }

    /* Progress */
    .progress {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: #f0f6ff;
      border-radius: 10px;
      text-align: center;
    }
    .progress.show { display: block; }
    .spinner {
      display: inline-block;
      width: 24px; height: 24px;
      border: 3px solid #cce0ff;
      border-top-color: #0071e3;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-bottom: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-text { font-size: 14px; color: #0071e3; font-weight: 500; }

    /* Error */
    .error {
      display: none;
      margin-top: 16px;
      padding: 12px 16px;
      background: #fff0f0;
      border: 1px solid #ffb3b3;
      border-radius: 10px;
      font-size: 13px;
      color: #c00;
    }
    .error.show { display: block; }

    /* Result */
    .result { display: none; margin-top: 24px; }
    .result.show { display: block; }
    .result-label { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
    .result img {
      width: 100%; border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }
    .result-actions { display: flex; gap: 8px; margin-top: 10px; }
    .result-actions a, .result-actions button {
      flex: 1; padding: 9px;
      border-radius: 8px;
      font-size: 13px; font-weight: 600;
      text-align: center; cursor: pointer;
      text-decoration: none;
    }
    .btn-download {
      background: #f0f6ff; color: #0071e3;
      border: 1.5px solid #cce0ff;
    }
    .btn-reset {
      background: #f5f5f7; color: #1d1d1f;
      border: 1.5px solid #d2d2d7;
    }
    .btn-reset:hover { background: #e8e8ed; }
  </style>
</head>
<body>

<div class="card">
  <h1>AI Image Editor</h1>
  <p class="subtitle">Virtual try-on via fal.ai — swap garments, preserve everything else</p>

  <!-- Backend URL -->
  <div class="url-row">
    <input id="backendUrl" type="text" value="http://localhost:3000" placeholder="Backend URL" />
  </div>

  <!-- Image pickers -->
  <div class="pickers">
    <!-- Person photo (file only) -->
    <div class="picker" id="sourcePicker">
      <span class="picker-icon">🧍</span>
      <span class="picker-label">Person Photo<br/><small>tap to select</small></span>
      <input type="file" accept="image/*" id="sourceFile" />
      <img id="sourcePreview" style="display:none" />
      <div class="picker-overlay"><span>Change</span></div>
    </div>

    <!-- Garment (file OR URL) -->
    <div class="garment-col">
      <!-- Tab toggle -->
      <div class="mode-tabs">
        <button class="mode-tab active" id="tabGallery" onclick="setGarmentMode('gallery')">Gallery</button>
        <button class="mode-tab"        id="tabUrl"     onclick="setGarmentMode('url')">URL</button>
      </div>

      <!-- Gallery mode -->
      <div id="garmentGalleryPanel">
        <div class="picker" id="refPicker">
          <span class="picker-icon">👕</span>
          <span class="picker-label">Garment Photo<br/><small>tap to select</small></span>
          <input type="file" accept="image/*" id="refFile" />
          <img id="refPreview" style="display:none" />
          <div class="picker-overlay"><span>Change</span></div>
        </div>
      </div>

      <!-- URL mode -->
      <div id="garmentUrlPanel" class="garment-url-panel" style="display:none">
        <div class="url-preview" id="urlPreview">
          <img id="urlPreviewImg" src="" alt="Garment preview" />
        </div>
        <input
          type="url"
          id="garmentUrl"
          placeholder="https://example.com/garment.jpg"
          oninput="onGarmentUrlChange(this.value)"
        />
      </div>
    </div>
  </div>

  <!-- Prompt -->
  <label for="prompt">Edit instruction</label>
  <textarea id="prompt" rows="2">Replace only the clothing and outfit on the person with the garment from the reference image. Do not change the face, skin tone, hair, body shape, or background. Only swap the clothes.</textarea>

  <!-- Model -->
  <label for="model">Model</label>
  <select id="model">
    <option value="seedream_v4_5" selected>Seedream 4.5 — multi-image clothing transfer</option>
    <option value="flux_kontext">Flux Kontext Max — context-aware editing</option>
    <option value="seedream_v5_lite">Seedream 5 lite — instruction-based editing</option>
    <option value="gpt_image_2">GPT Image 2 — detailed edits, 4K</option>
    <option value="image_auto">Auto — best model</option>
  </select>

  <button class="primary" id="generateBtn" onclick="run()">Generate</button>

  <!-- Progress -->
  <div class="progress" id="progress">
    <div class="spinner"></div>
    <div class="progress-text" id="progressText">Starting…</div>
  </div>

  <!-- Error -->
  <div class="error" id="errorBox"></div>

  <!-- Result -->
  <div class="result" id="resultBox">
    <div class="result-label">✅ Result</div>
    <img id="resultImg" src="" alt="Generated image" />
    <div class="result-actions">
      <a class="btn-download" id="downloadLink" download="generated.jpg">⬇ Download</a>
      <button class="btn-reset" onclick="reset()">↺ Reset</button>
    </div>
  </div>
</div>

<script>
  let garmentMode = 'gallery'; // 'gallery' | 'url'

  // ── Mode toggle ──────────────────────────────────────────────────────────────
  function setGarmentMode(mode) {
    garmentMode = mode;
    document.getElementById('tabGallery').classList.toggle('active', mode === 'gallery');
    document.getElementById('tabUrl').classList.toggle('active', mode === 'url');
    document.getElementById('garmentGalleryPanel').style.display = mode === 'gallery' ? '' : 'none';
    document.getElementById('garmentUrlPanel').style.display     = mode === 'url'     ? '' : 'none';
  }

  function onGarmentUrlChange(val) {
    const preview = document.getElementById('urlPreview');
    const img     = document.getElementById('urlPreviewImg');
    const trimmed = val.trim();
    if (trimmed.startsWith('http://') || trimmed.startsWith('https://')) {
      img.src = trimmed;
      preview.classList.add('show');
    } else {
      preview.classList.remove('show');
      img.src = '';
    }
  }

  // ── Preview on file select ──────────────────────────────────────────────────
  function wirePreview(inputId, previewId, pickerId) {
    document.getElementById(inputId).addEventListener('change', function() {
      const file = this.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const img = document.getElementById(previewId);
      img.src = url;
      img.style.display = 'block';
      document.getElementById(pickerId).classList.add('has-image');
    });
  }
  wirePreview('sourceFile', 'sourcePreview', 'sourcePicker');
  wirePreview('refFile',    'refPreview',    'refPicker');

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function setProgress(msg) {
    document.getElementById('progressText').textContent = msg;
    document.getElementById('progress').classList.add('show');
  }
  function showError(msg) {
    const el = document.getElementById('errorBox');
    el.textContent = '⚠ ' + msg;
    el.classList.add('show');
    document.getElementById('progress').classList.remove('show');
    document.getElementById('generateBtn').disabled = false;
  }
  function base() { return document.getElementById('backendUrl').value.replace(/\/$/, ''); }

  // ── Upload one image (file) ──────────────────────────────────────────────────
  async function uploadFile(label, file) {
    if (!file) throw new Error(`${label} file is missing`);
    const form = new FormData();
    form.append('file', file);
    const res = await fetch(`${base()}/api/images/upload`, { method: 'POST', body: form });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(`${label} upload failed (${res.status}): ${body.message ?? res.statusText}`);
    }
    const data = await res.json();
    if (!data.mediaId) throw new Error(`${label} upload succeeded but no mediaId returned`);
    return data.mediaId;
  }

  // ── Upload garment from external URL ─────────────────────────────────────────
  async function uploadFromUrl(imageUrl) {
    const res = await fetch(`${base()}/api/images/upload-url`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: imageUrl })
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(`URL upload failed (${res.status}): ${body.message ?? res.statusText}`);
    }
    const data = await res.json();
    if (!data.mediaId) throw new Error('URL upload succeeded but no mediaId returned');
    return data.mediaId;
  }

  // ── Poll job ─────────────────────────────────────────────────────────────────
  async function pollJob(jobId) {
    for (let i = 0; i < 40; i++) {
      await new Promise(r => setTimeout(r, 3000));
      const res = await fetch(`${base()}/api/images/jobs/${jobId}`);
      const data = await res.json();
      setProgress(`Generating • ${data.status}`);
      if (data.status === 'completed') return data.outputUrl;
      if (data.status === 'failed') throw new Error('Generation failed on server.');
    }
    throw new Error('Timed out after 2 minutes.');
  }

  // ── Main flow ────────────────────────────────────────────────────────────────
  async function run() {
    document.getElementById('errorBox').classList.remove('show');
    document.getElementById('resultBox').classList.remove('show');

    const sourceFile  = document.getElementById('sourceFile').files[0];
    const garmentUrl  = document.getElementById('garmentUrl').value.trim();
    const refFile     = document.getElementById('refFile').files[0];
    const prompt      = document.getElementById('prompt').value.trim();

    if (!sourceFile) return showError('Please select a person photo.');
    if (garmentMode === 'gallery' && !refFile)     return showError('Please select a garment photo.');
    if (garmentMode === 'url'     && !garmentUrl)  return showError('Please enter a garment image URL.');
    if (!prompt) return showError('Please enter an edit instruction.');

    document.getElementById('generateBtn').disabled = true;

    try {
      setProgress('Uploading person photo…');
      const sourceId = await uploadFile('Person', sourceFile);

      setProgress('Uploading garment…');
      const refId = garmentMode === 'url'
        ? await uploadFromUrl(garmentUrl)
        : await uploadFile('Garment', refFile);

      setProgress('Submitting to AI…');
      const genRes = await fetch(`${base()}/api/images/generate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sourceMediaId: sourceId,
          referenceMediaId: refId,
          prompt,
          model: document.getElementById('model').value
        })
      });
      if (!genRes.ok) throw new Error(`Generate failed: ${genRes.status} ${await genRes.text()}`);
      const { jobId } = await genRes.json();

      setProgress('Generating • pending');
      const outputUrl = await pollJob(jobId);

      document.getElementById('progress').classList.remove('show');
      document.getElementById('resultImg').src = outputUrl;
      document.getElementById('downloadLink').href = outputUrl;
      document.getElementById('resultBox').classList.add('show');
      document.getElementById('generateBtn').disabled = false;

    } catch (err) {
      showError(err.message);
    }
  }

  function reset() {
    document.getElementById('sourceFile').value = '';
    document.getElementById('refFile').value = '';
    document.getElementById('sourcePreview').style.display = 'none';
    document.getElementById('refPreview').style.display = 'none';
    document.getElementById('sourcePicker').classList.remove('has-image');
    document.getElementById('refPicker').classList.remove('has-image');
    document.getElementById('garmentUrl').value = '';
    document.getElementById('urlPreview').classList.remove('show');
    document.getElementById('resultBox').classList.remove('show');
    document.getElementById('errorBox').classList.remove('show');
    document.getElementById('generateBtn').disabled = false;
    setGarmentMode('gallery');
  }
</script>
</body>
</html>
